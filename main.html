<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Афганская война - Галерея</title>
    <style>
        /* --- ОБЩИЕ НАСТРОЙКИ --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            /* Запрещаем скролл всего сайта */
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        header {
            height: 70px; /* Фиксированная высота шапки */
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #556b2f;
            margin: 0 20px;
        }

        header h1 {
            font-size: 1.5rem;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- ГЛАВНАЯ СЕТКА --- */
        .layout-grid {
            display: grid;
            /* 8 колонок: 1 фото | 6 видео | 1 фото */
            grid-template-columns: minmax(60px, 120px) repeat(6, 1fr) minmax(60px, 120px); 
            /* 5 строк: Верх | 3 средних | Низ */
            /* Все строки равны (1fr), но верх/низ можно сделать чуть меньше */
            grid-template-rows: 1fr 1fr 1fr 1fr 1fr;
            gap: 8px;
            padding: 10px 20px 20px 20px;
            /* Сетка занимает всю высоту экрана минус шапка */
            height: calc(100vh - 70px); 
            width: 100%;
        }

        /* --- СТИЛИ ДЛЯ ФОТО --- */
        .photo-item {
            background-color: #333;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            border: 1px solid #444;
            transition: 0.3s;
            width: 100%;
            height: 100%; /* Фото заполняет свою ячейку */
        }

        .photo-item:hover {
            border-color: #d4af37;
            transform: scale(1.02);
            z-index: 10;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Обрезает фото, чтобы оно влезло без искажений */
            display: block;
        }

        /* --- СТИЛИ ДЛЯ ВИДЕО --- */
        .video-container {
            /* Видео занимает центральные 6 колонок и 3 строки */
            grid-column: 2 / 8; 
            grid-row: 2 / 5;    
            background-color: #000;
            border: 2px solid #556b2f;
            border-radius: 6px;
            overflow: hidden;
            width: 100%;
            height: 100%; /* Заполняет пространство */
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- РАСПОЛОЖЕНИЕ ФОТО --- */
        
        /* ВЕРХНИЙ РЯД (8 фото) */
        .top-row-1 { grid-column: 1; grid-row: 1; }
        .top-row-2 { grid-column: 2; grid-row: 1; }
        .top-row-3 { grid-column: 3; grid-row: 1; }
        .top-row-4 { grid-column: 4; grid-row: 1; }
        .top-row-5 { grid-column: 5; grid-row: 1; }
        .top-row-6 { grid-column: 6; grid-row: 1; }
        .top-row-7 { grid-column: 7; grid-row: 1; }
        .top-row-8 { grid-column: 8; grid-row: 1; }

        /* ЛЕВАЯ КОЛОНКА (3 фото) */
        .left-col-1 { grid-column: 1; grid-row: 2; }
        .left-col-2 { grid-column: 1; grid-row: 3; }
        .left-col-3 { grid-column: 1; grid-row: 4; }

        /* ПРАВАЯ КОЛОНКА (3 фото) */
        .right-col-1 { grid-column: 8; grid-row: 2; }
        .right-col-2 { grid-column: 8; grid-row: 3; }
        .right-col-3 { grid-column: 8; grid-row: 4; }

        /* НИЖНИЙ РЯД (8 фото) */
        .bottom-row-1 { grid-column: 1; grid-row: 5; }
        .bottom-row-2 { grid-column: 2; grid-row: 5; }
        .bottom-row-3 { grid-column: 3; grid-row: 5; }
        .bottom-row-4 { grid-column: 4; grid-row: 5; }
        .bottom-row-5 { grid-column: 5; grid-row: 5; }
        .bottom-row-6 { grid-column: 6; grid-row: 5; }
        .bottom-row-7 { grid-column: 7; grid-row: 5; }
        .bottom-row-8 { grid-column: 8; grid-row: 5; }

        /* --- ДЛЯ МАЛЕНЬКИХ ЭКРАНОВ (чтобы не ломалось) --- */
        @media (max-width: 900px) {
            body { overflow: auto; height: auto; }
            .layout-grid { 
                display: flex; 
                flex-direction: column; 
                height: auto; 
            }
            .photo-item { display: none; }
            .video-container { height: 250px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Хроника Афганской войны</h1>
    </header>

    <div class="layout-grid">

        <!-- ВЕРХНИЙ РЯД (8 фото) -->
        <div class="photo-item top-row-1"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Soviet_troops_in_Afghanistan.jpg/640px-Soviet_troops_in_Afghanistan.jpg" alt="1"></div>
        <div class="photo-item top-row-2"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Afghanistan_1988.jpg/640px-Afghanistan_1988.jpg" alt="2"></div>

        <div class="photo-item top-row-8"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Afghanistan_1988.jpg/640px-Afghanistan_1988.jpg" alt="8"></div>

        <div class="photo-item left-col-2"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Bridge_of_friendship_afghanistan.jpg/640px-Bridge_of_friendship_afghanistan.jpg" alt="10"></div>

        <div class="photo-item right-col-1"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Afghanistan_1986.jpg/640px-Afghanistan_1986.jpg" alt="12"></div>

        <div class="photo-item right-col-3"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Afghanistan_1988.jpg/640px-Afghanistan_1988.jpg" alt="14"></div>

        <!-- НИЖНИЙ РЯД (8 фото) -->
        <div class="photo-item bottom-row-1"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Evstafiev-afghan-soldier.jpg/640px-Evstafiev-afghan-soldier.jpg" alt="15"></div>
        <div class="photo-item bottom-row-2"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Bridge_of_friendship_afghanistan.jpg/640px-Bridge_of_friendship_afghanistan.jpg" alt="16"></div>

        <div class="photo-item bottom-row-4"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Afghanistan_1986.jpg/640px-Afghanistan_1986.jpg" alt="18"></div>
        <div class="photo-item bottom-row-5"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Soviet_troops_in_Afghanistan.jpg/640px-Soviet_troops_in_Afghanistan.jpg" alt="19"></div>
        <div class="photo-item bottom-row-6"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Afghanistan_1988.jpg/640px-Afghanistan_1988.jpg" alt="20"></div>
        <div class="photo-item bottom-row-7"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Evstafiev-afghan-soldier.jpg/640px-Evstafiev-afghan-soldier.jpg" alt="21"></div>
        <div class="photo-item bottom-row-8"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Bridge_of_friendship_afghanistan.jpg/640px-Bridge_of_friendship_afghanistan.jpg" alt="22"></div>
